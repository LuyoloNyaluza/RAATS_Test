version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: raats
      POSTGRES_PASSWORD: raats_pass
      POSTGRES_DB: raats_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "raats"]
      interval: 30s
      timeout: 10s
      retries: 5
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  agent-api:
    build:
      context: ..
      dockerfile: deployment/agent/Dockerfile
    container_name: agent_api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=host.docker.internal:11434
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=raats
      - POSTGRES_PASSWORD=raats_pass
      - POSTGRES_DB=raats_db
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - agent-api
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning/dashboards/raats.yaml:/etc/grafana/provisioning/dashboards/raats.yaml:ro
    depends_on:
      - prometheus
    restart: unless-stopped
volumes:
  ollama_data: {}
  postgres_data: {}
  chroma_data: {}
  grafana_data: {}
