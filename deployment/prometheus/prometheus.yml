# yaml-language-server: $schema=https://json.schemastore.org/prometheus.json
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "raats-agent-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-api:8000"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["172.30.103.42:9100"]
